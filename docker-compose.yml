# Three containers: Prowlarr, the bridge, and Caddy in front of both.
#
# Only Caddy publishes a port. Prowlarr and the bridge are reachable on the
# private network between them and nowhere else, which is why Prowlarr can be
# set to `External` auth without being open to the world.

services:
  prowlarr:
    # Overridable so update.sh can pin a known-good digest if an update
    # breaks. Unset means the current release, which is what you want.
    image: ${PROWLARR_IMAGE:-lscr.io/linuxserver/prowlarr:latest}
    container_name: prowlarr
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-UTC}
    volumes:
      - ./prowlarr/config:/config
    # Deliberately no `ports:`. Prowlarr is for Caddy and the bridge to reach,
    # not the internet. Adding one here would expose an instance that does no
    # authentication of its own.
    networks: [inside]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:9696/prowlarr/ping"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  bridge:
    image: node:20-alpine
    container_name: bridge
    restart: unless-stopped
    working_dir: /app
    command: node worker.js
    environment:
      # What your app sends here.
      - BRIDGE_API_KEY=${BRIDGE_API_KEY}
      # What this sends to Prowlarr. It never travels back to a client.
      - PROWLARR_URL=http://prowlarr:9696/prowlarr
      - PROWLARR_APIKEY=${PROWLARR_API_KEY}
      - BRIDGE_HOST=0.0.0.0
      - BRIDGE_PORT=8788
      # Speed knobs. Defaults match the bridge's own, so leaving these unset
      # changes nothing; set them in .env when a search is slower than you want.
      # A Prowlarr search waits for its slowest indexer, so the biggest lever by
      # far is the first one: ask fewer indexers.
      - PROWLARR_INDEXER_IDS=${PROWLARR_INDEXER_IDS:-}
      - BRIDGE_TIMEOUT_S=${BRIDGE_TIMEOUT_S:-45}
      - BRIDGE_MAX_ROWS=${BRIDGE_MAX_ROWS:-100}
      - BRIDGE_BROWSE_ROWS=${BRIDGE_BROWSE_ROWS:-25}
      - BRIDGE_MAX_RESOLVE=${BRIDGE_MAX_RESOLVE:-12}
    volumes:
      - ./bridge/worker.js:/app/worker.js:ro
    # Ordering only, deliberately NOT `condition: service_healthy`. The bridge
    # dials Prowlarr per request and reports the failure through /healthz, so it
    # has no reason to refuse to start — and gating on health here would stop
    # Caddy starting too, leaving 80 and 443 unbound and the certificate
    # unrenewable while Prowlarr was unwell.
    depends_on: [prowlarr]
    networks: [inside]

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - ./caddy/logs:/var/log/caddy
    depends_on: [prowlarr, bridge]
    networks: [inside]

networks:
  inside:
    driver: bridge

volumes:
  # Certificates live here. Losing this means Let's Encrypt has to issue again,
  # and there is a rate limit on that, so leave it alone.
  caddy_data:
  caddy_config:
